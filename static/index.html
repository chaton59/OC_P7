<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assistant Événements GPSO</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .chat-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 760px;
      height: 92vh;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,.12);
      overflow: hidden;
    }

    /* ── Header ── */
    .chat-header {
      background: linear-gradient(135deg, #1a73e8, #0d47a1);
      color: #fff;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .chat-header .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .chat-header h1 { font-size: 1.05rem; font-weight: 600; line-height: 1.2; }
    .chat-header p  { font-size: .78rem; opacity: .8; margin-top: 2px; }

    /* ── Messages ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .message {
      display: flex;
      gap: 10px;
      max-width: 82%;
    }

    .message.user  { align-self: flex-end; flex-direction: row-reverse; }
    .message.bot   { align-self: flex-start; }

    .bubble {
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.55;
      font-size: .92rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user .bubble {
      background: #1a73e8;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.bot .bubble {
      background: #f1f3f4;
      color: #1c1c1c;
      border-bottom-left-radius: 4px;
    }

    /* Sources card */
    .sources {
      margin-top: 10px;
      border-top: 1px solid #ddd;
      padding-top: 8px;
    }

    .sources-title {
      font-size: .75rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .source-item {
      font-size: .8rem;
      color: #444;
      padding: 4px 0;
      border-bottom: 1px dashed #e0e0e0;
    }
    .source-item:last-child { border-bottom: none; }
    .source-item strong { color: #1a73e8; }

    /* Typing indicator */
    .typing .bubble {
      background: #f1f3f4;
      padding: 14px 18px;
    }

    .dots { display: flex; gap: 5px; align-items: center; }
    .dots span {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #999;
      animation: bounce .9s infinite;
    }
    .dots span:nth-child(2) { animation-delay: .15s; }
    .dots span:nth-child(3) { animation-delay: .3s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    /* ── Input bar ── */
    .input-area {
      display: flex;
      gap: 10px;
      padding: 16px 20px;
      border-top: 1px solid #e8eaed;
      background: #fff;
    }

    #userInput {
      flex: 1;
      padding: 11px 16px;
      border: 1.5px solid #dadce0;
      border-radius: 24px;
      font-size: .93rem;
      outline: none;
      transition: border-color .2s;
      resize: none;
      height: 44px;
      max-height: 120px;
      overflow-y: auto;
      font-family: inherit;
    }

    #userInput:focus { border-color: #1a73e8; }

    #sendBtn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: #1a73e8;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background .2s, transform .1s;
    }

    #sendBtn:hover:not(:disabled)  { background: #1558b0; }
    #sendBtn:active:not(:disabled) { transform: scale(.93); }
    #sendBtn:disabled { background: #aaa; cursor: default; }

    #sendBtn svg { width: 20px; height: 20px; fill: #fff; }

    /* Confidence badge */
    .confidence {
      display: inline-block;
      margin-top: 6px;
      font-size: .72rem;
      background: #e8f0fe;
      color: #1a73e8;
      padding: 2px 8px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
<div class="chat-container">

  <div class="chat-header">
    <div class="avatar">🎭</div>
    <div>
      <h1>Assistant Événements Culturels GPSO</h1>
      <p>Posez vos questions sur les événements de Grand Paris Seine Ouest</p>
    </div>
  </div>

  <div id="messages">
    <div class="message bot">
      <div class="bubble">Bonjour ! 👋 Je suis votre assistant pour les événements culturels de Grand Paris Seine Ouest. Que souhaitez-vous savoir ?</div>
    </div>
  </div>

  <div class="input-area">
    <textarea id="userInput" placeholder="Posez votre question…" rows="1"></textarea>
    <button id="sendBtn" title="Envoyer">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>

</div>

<script>
  const messagesEl = document.getElementById('messages');
  const input      = document.getElementById('userInput');
  const sendBtn    = document.getElementById('sendBtn');

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addMessage(role, html) {
    const msg = document.createElement('div');
    msg.className = `message ${role}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = html;
    msg.appendChild(bubble);
    messagesEl.appendChild(msg);
    scrollToBottom();
    return msg;
  }

  function addTyping() {
    const msg = document.createElement('div');
    msg.className = 'message bot typing';
    msg.innerHTML = `<div class="bubble"><div class="dots"><span></span><span></span><span></span></div></div>`;
    messagesEl.appendChild(msg);
    scrollToBottom();
    return msg;
  }

  function escapeHtml(text) {
    return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }

  function buildBotHtml(data) {
    let html = escapeHtml(data.answer);

    if (data.confidence !== undefined) {
      const pct = Math.round(data.confidence * 100);
      html += `<br><span class="confidence">Confiance : ${pct}%</span>`;
    }

    if (data.sources && data.sources.length > 0) {
      html += `<div class="sources"><div class="sources-title">Sources</div>`;
      data.sources.forEach(s => {
        html += `<div class="source-item"><strong>${escapeHtml(s.title)}</strong> — ${escapeHtml(s.location)} — ${escapeHtml(s.date)}</div>`;
      });
      html += `</div>`;
    }

    return html;
  }

  async function sendMessage() {
    const question = input.value.trim();
    if (!question) return;

    input.value = '';
    input.style.height = '44px';
    sendBtn.disabled = true;

    addMessage('user', escapeHtml(question));
    const typingEl = addTyping();

    try {
      const res = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        throw new Error(err.detail || `Erreur ${res.status}`);
      }

      const data = await res.json();
      typingEl.remove();
      addMessage('bot', buildBotHtml(data));

    } catch (err) {
      typingEl.remove();
      addMessage('bot', `⚠️ <em>${escapeHtml(err.message)}</em>`);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  /* Auto-resize textarea */
  input.addEventListener('input', () => {
    input.style.height = '44px';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });
</script>
</body>
</html>
